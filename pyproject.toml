[project]
name = "archestral"
version = "0.1.0"
description = "Archestral - Adaptive Orchestral Sandbox: embodied conducting and spatial orchestration learning"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<2", "aiohttp>=3.9,<4"]

[project.optional-dependencies]
vision = ["mediapipe==0.10.21", "opencv-contrib-python==4.11.0.86"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
